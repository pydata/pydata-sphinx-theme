version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "tag: dependencies"
      - "tag: CI"
  # pip, only for playwright, which we pin (see pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "playwright"
    cooldown:
      default-days: 7
    labels:
      - "tag: dependencies"
      - "tag: CI"
  # npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "tag: dependencies"
      - "tag: javascript"
    open-pull-requests-limit: 0 # security updates only
