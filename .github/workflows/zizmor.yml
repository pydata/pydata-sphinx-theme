# Performs static analysis in GitHub actions with https://github.com/woodruffw/zizmor
name: Zizmor

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  zizmor:
    name: "Run Zizmor"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: "Checkout repository 🛎"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Run zizmor 🕵️‍♂️"
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
