# Reusable action to set our PST development environment
# DO NOT use for release jobs since we cache dependencies
# IMPORTANT: if you make changes to this action, you will need to open a follow-up
# PR after merge to update the action SHA in the a11y, CI, docs, and prerelease
# workflows
name: Setup PST CI environment
description: Create a PST dev environment

inputs:
  python-version:
    description: Default Python version to use if none is specified
    required: false
    default: "3.12"
  pandoc:
    description: Whether this should install pandoc or not
    required: false
    default: "false"
  graphviz:
    description: Whether this should install Graphviz or not
    required: false
    default: "false"
  playwright-browser:
    description: The Playwright browser to cache (e.g. chromium), if any
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: "Setup Python 🐍"
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: "pyproject.toml"
        allow-prereleases: true

    - run: python -Im pip install tox-uv
      shell: bash

    - name: "Install pandoc 📝"
      uses: r-lib/actions/setup-pandoc@v2
      with:
        pandoc-version: "latest"
      if: ${{ inputs.pandoc == 'true' }}

    - name: "Install Graphviz (Linux)"
      if: ${{ inputs.graphviz == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes graphviz

    - name: "Install Graphviz (macOS)"
      if: ${{ inputs.graphviz == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: brew install graphviz
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"

    - name: "Install Graphviz (Windows)"
      if: ${{ inputs.graphviz == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        choco install graphviz --yes --no-progress

    - name: "Check Graphviz installation"
      if: ${{ inputs.graphviz == 'true' }}
      shell: bash
      run: dot -V

    # The cache key includes:
    # - a hash of pyproject.toml, where playwright is pinned, as each
    #   playwright version requires specific browser versions
    # - the runner image (e.g. ubuntu24), as some browser builds are OS
    #   version specific
    - name: "Get Playwright cache key 🎭"
      id: playwright-cache
      if: ${{ inputs.playwright-browser != '' }}
      shell: bash
      env:
        BROWSER: ${{ inputs.playwright-browser }}
        PYPROJECT_HASH: ${{ hashFiles('pyproject.toml') }}
      run: echo "key=playwright-$ImageOS-$BROWSER-$PYPROJECT_HASH" >> "$GITHUB_OUTPUT"

    - name: "Cache Playwright browsers 🎭"
      if: ${{ inputs.playwright-browser != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
          ~\AppData\Local\ms-playwright
        key: ${{ steps.playwright-cache.outputs.key }}
